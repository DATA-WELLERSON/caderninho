repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.2
    hooks:
      - id: uv-lock
      - id: uv-export
        args: [--no-dev, --no-hashes, --no-header, --no-emit-project, --format, requirements-txt, -o, requirements.txt]
